<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Admin — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">
  <div id="navbar"></div>
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto hidden lg:block">
      <div class="p-6">
        <nav class="space-y-1">
          <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>📊</span> Dashboard</a>
          <a href="users.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>👥</span> Users</a>
          <a href="vendors.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🏪</span> Vendors</a>
          <a href="products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>📦</span> Products</a>
          <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🛍️</span> Orders</a>
          <a href="categories.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🗂️</span> Categories</a>
          <a href="reviews.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>⭐</span> Reviews</a>
          <a href="analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"><span>📈</span> Analytics</a>
          <hr class="my-3 border-gray-100">
          <a href="../index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🏠</span> View Store</a>
          <button onclick="Auth.logout()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 w-full text-left"><span>🚪</span> Logout</button>
        </nav>
      </div>
    </aside>
    <main class="flex-1 lg:ml-64 p-6">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Analytics</h1>
        <p class="text-gray-500 mt-1">Platform performance overview</p>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Total Revenue</p>
          <p class="text-2xl font-bold text-indigo-600" id="total-revenue">—</p>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Total Orders</p>
          <p class="text-2xl font-bold text-gray-900" id="total-orders">—</p>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Paid Orders</p>
          <p class="text-2xl font-bold text-green-600" id="paid-orders">—</p>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Total Products</p>
          <p class="text-2xl font-bold text-gray-900" id="total-products">—</p>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Total Buyers</p>
          <p class="text-2xl font-bold text-gray-900" id="total-buyers">—</p>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <p class="text-sm text-gray-500 mb-1">Active Vendors</p>
          <p class="text-2xl font-bold text-gray-900" id="total-vendors">—</p>
        </div>
      </div>

      <!-- Revenue Chart -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4">
          Revenue & Orders (Last 6 Months)
        </h2>
        <div class="relative w-full overflow-hidden">
          <canvas id="revenue-chart"></canvas>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/admin/analytics.js"></script>
</body>
</html>
