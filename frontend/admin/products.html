<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Admin — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">
  <div id="navbar"></div>
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto hidden lg:block">
      <div class="p-6">
        <nav class="space-y-1">
          <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>📊</span> Dashboard</a>
          <a href="users.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>👥</span> Users</a>
          <a href="vendors.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🏪</span> Vendors</a>
          <a href="products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"><span>📦</span> Products</a>
          <a href="orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🛍️</span> Orders</a>
          <a href="categories.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🗂️</span> Categories</a>
          <a href="reviews.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>⭐</span> Reviews</a>
          <a href="analytics.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>📈</span> Analytics</a>
          <hr class="my-3 border-gray-100">
          <a href="../index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50"><span>🏠</span> View Store</a>
          <button onclick="Auth.logout()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 w-full text-left"><span>🚪</span> Logout</button>
        </nav>
      </div>
    </aside>
    <main class="flex-1 lg:ml-64 p-6">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">All Products</h1>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50 border-b border-gray-100">
              <tr>
                <th class="text-left px-6 py-4 text-sm font-medium text-gray-500">Product</th>
                <th class="text-left px-6 py-4 text-sm font-medium text-gray-500">Vendor</th>
                <th class="text-left px-6 py-4 text-sm font-medium text-gray-500">Price</th>
                <th class="text-left px-6 py-4 text-sm font-medium text-gray-500">Stock</th>
                <th class="text-left px-6 py-4 text-sm font-medium text-gray-500">Status</th>
                <th class="text-left px-6 py-4 text-sm font-medium text-gray-500">Actions</th>
              </tr>
            </thead>
            <tbody id="products-table"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/admin/products.js"></script>
</body>
</html>
