<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Settings — Vendora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="bg-gray-50">
    <div id="navbar"></div>

    <!-- Mobile Menu State (Alpine.js) -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape="sidebarOpen = false">
      <!-- Mobile Hamburger Button -->
      <button
        @click="sidebarOpen = !sidebarOpen"
        class="lg:hidden fixed top-20 left-4 z-40 p-2.5 bg-indigo-600 text-white rounded-lg shadow-lg hover:bg-indigo-700 transition"
      >
        <span
          x-text="sidebarOpen ? '✕' : '☰'"
          class="text-xl font-bold"
        ></span>
      </button>

      <!-- Mobile Backdrop -->
      <div
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        class="lg:hidden fixed inset-0 bg-black bg-opacity-40 z-30 transition-opacity"
        style="display: none"
      ></div>

      <div class="flex min-h-screen">
        <!-- ─── Sidebar ─── -->
        <aside
          class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto transform transition-transform duration-300 ease-out lg:translate-x-0 lg:relative lg:z-auto"
          :class="sidebarOpen ? 'translate-x-0 z-40' : '-translate-x-full z-40'"
        >
          <div class="p-6">
            <p
              class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4"
            >
              Admin Menu
            </p>
            <nav class="space-y-1">
              <a
                href="dashboard.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>📊</span> Dashboard
              </a>
              <a
                href="users.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>👥</span> Users
              </a>
              <a
                href="vendors.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🏪</span> Vendors
              </a>
              <a
                href="products.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>📦</span> Products
              </a>
              <a
                href="orders.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🛍️</span> Orders
              </a>
              <a
                href="categories.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🗂️</span> Categories
              </a>
              <a
                href="reviews.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>⭐</span> Reviews
              </a>
              <a
                href="analytics.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>📈</span> Analytics
              </a>
              <a
                href="settings.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"
              >
                <span>⚙️</span> Settings
              </a>
              <hr class="my-3 border-gray-100" />
              <a
                href="../index.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🏠</span> View Store
              </a>
              <button
                onclick="Auth.logout()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition w-full text-left"
              >
                <span>🚪</span> Logout
              </button>
            </nav>
          </div>
        </aside>

        <!-- ─── Main Content ─── -->
        <main class="flex-1 lg:ml-64 p-6">
          <!-- Header -->
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
            <p class="text-gray-500 mt-1">Manage your admin account</p>
          </div>

          <div class="max-w-2xl space-y-6">
            <!-- Personal Settings -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
              <h2 class="text-lg font-bold text-gray-900 mb-6">
                Personal Settings
              </h2>

              <div class="space-y-6">
                <!-- Update Name -->
                <form id="name-form" class="space-y-4">
                  <h3 class="text-sm font-medium text-gray-700">Update Name</h3>
                  <div>
                    <label
                      class="block text-sm font-medium text-gray-600 mb-1"
                    >
                      Your Name
                    </label>
                    <input
                      type="text"
                      id="user-name"
                      placeholder="Your full name"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <button
                    type="submit"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700 transition disabled:opacity-50"
                  >
                    Update Name
                  </button>
                </form>

                <hr class="border-gray-200" />

                <!-- Change Password -->
                <form id="password-form" class="space-y-4">
                  <h3 class="text-sm font-medium text-gray-700">
                    Change Password
                  </h3>
                  <div>
                    <label
                      class="block text-sm font-medium text-gray-600 mb-1"
                    >
                      Current Password
                    </label>
                    <input
                      type="password"
                      id="current-password"
                      placeholder="Enter your current password"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-medium text-gray-600 mb-1"
                    >
                      New Password
                    </label>
                    <input
                      type="password"
                      id="new-password"
                      placeholder="Enter your new password"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label
                      class="block text-sm font-medium text-gray-600 mb-1"
                    >
                      Confirm New Password
                    </label>
                    <input
                      type="password"
                      id="confirm-password"
                      placeholder="Confirm your new password"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <button
                    type="submit"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700 transition disabled:opacity-50"
                  >
                    Change Password
                  </button>
                </form>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/router.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/loader.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/admin/settings.js"></script>
  </body>
</html>
