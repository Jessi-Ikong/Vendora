<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users — Admin — Vendora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="bg-gray-50">
    <div id="navbar"></div>

    <div class="flex min-h-screen">
      <aside
        class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto hidden lg:block"
      >
        <div class="p-6">
          <p
            class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4"
          >
            Admin Menu
          </p>
          <nav class="space-y-1">
            <a
              href="dashboard.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>📊</span> Dashboard
            </a>
            <a
              href="users.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"
            >
              <span>👥</span> Users
            </a>
            <a
              href="vendors.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>🏪</span> Vendors
            </a>
            <a
              href="products.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>📦</span> Products
            </a>
            <a
              href="orders.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>🛍️</span> Orders
            </a>
            <a
              href="categories.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>🗂️</span> Categories
            </a>
            <a
              href="reviews.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>⭐</span> Reviews
            </a>
            <a
              href="analytics.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>📈</span> Analytics
            </a>
            <hr class="my-3 border-gray-100" />
            <a
              href="../index.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>🏠</span> View Store
            </a>
            <button
              onclick="Auth.logout()"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition w-full text-left"
            >
              <span>🚪</span> Logout
            </button>
          </nav>
        </div>
      </aside>

      <main class="flex-1 lg:ml-64 p-6">
        <div class="mb-8">
          <h1 class="text-3xl font-bold text-gray-900">Users</h1>
          <p class="text-gray-500 mt-1" id="users-count"></p>
        </div>

        <!-- Search & Filter -->
        <div
          class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 flex gap-4"
        >
          <input
            type="text"
            id="search-input"
            placeholder="Search by name or email..."
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <select
            id="role-filter"
            onchange="filterUsers()"
            class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="all">All Roles</option>
            <option value="buyer">Buyers</option>
            <option value="vendor">Vendors</option>
            <option value="admin">Admins</option>
          </select>
        </div>

        <!-- Users Table -->
        <div
          class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
        >
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-gray-100">
                <tr>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    User
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Role
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Status
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Joined
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody id="users-table"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/router.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/loader.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/admin/users.js"></script>
  </body>
</html>
