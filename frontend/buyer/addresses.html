<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Addresses — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="max-w-3xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-4">
        <a href="dashboard.html"
           class="text-gray-400 hover:text-gray-600 transition">
          ←
        </a>
        <h1 class="text-3xl font-bold text-gray-900">
          My Addresses
        </h1>
      </div>
      <button onclick="showAddForm()"
              id="add-btn"
              class="bg-indigo-600 text-white px-4 py-2
                     rounded-xl text-sm font-medium
                     hover:bg-indigo-700 transition">
        + Add Address
      </button>
    </div>

    <!-- Add/Edit Form -->
    <div id="address-form-card"
         class="hidden bg-white rounded-xl shadow-sm border
                border-gray-100 p-6 mb-6">
      <h2 class="text-lg font-bold text-gray-900 mb-4"
          id="form-title">
        Add New Address
      </h2>
      <form id="address-form" class="space-y-4">
        <input type="hidden" id="editing-id"/>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium
                          text-gray-700 mb-1">
              Full Name *
            </label>
            <input type="text" id="addr-full-name"
                   class="w-full px-4 py-3 border border-gray-300
                          rounded-lg focus:outline-none focus:ring-2
                          focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium
                          text-gray-700 mb-1">
              Phone *
            </label>
            <input type="text" id="addr-phone"
                   class="w-full px-4 py-3 border border-gray-300
                          rounded-lg focus:outline-none focus:ring-2
                          focus:ring-indigo-500"/>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium
                        text-gray-700 mb-1">
            Address Line 1 *
          </label>
          <input type="text" id="addr-line1"
                 placeholder="Street address, house number"
                 class="w-full px-4 py-3 border border-gray-300
                        rounded-lg focus:outline-none focus:ring-2
                        focus:ring-indigo-500"/>
        </div>
        <div>
          <label class="block text-sm font-medium
                        text-gray-700 mb-1">
            Address Line 2
            <span class="text-gray-400 font-normal">Optional</span>
          </label>
          <input type="text" id="addr-line2"
                 placeholder="Apartment, floor, landmark"
                 class="w-full px-4 py-3 border border-gray-300
                        rounded-lg focus:outline-none focus:ring-2
                        focus:ring-indigo-500"/>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium
                          text-gray-700 mb-1">
              City *
            </label>
            <input type="text" id="addr-city"
                   class="w-full px-4 py-3 border border-gray-300
                          rounded-lg focus:outline-none focus:ring-2
                          focus:ring-indigo-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium
                          text-gray-700 mb-1">
              State *
            </label>
            <input type="text" id="addr-state"
                   class="w-full px-4 py-3 border border-gray-300
                          rounded-lg focus:outline-none focus:ring-2
                          focus:ring-indigo-500"/>
          </div>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" id="save-addr-btn"
                  class="bg-indigo-600 text-white px-6 py-3
                         rounded-lg font-medium hover:bg-indigo-700
                         transition">
            Save Address
          </button>
          <button type="button" onclick="hideForm()"
                  class="border border-gray-300 px-6 py-3
                         rounded-lg text-gray-600 hover:bg-gray-50
                         transition">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <!-- Addresses List -->
    <div id="addresses-list" class="space-y-4"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <p class="text-5xl mb-4">📍</p>
      <h3 class="text-xl font-bold text-gray-700 mb-2">
        No addresses yet
      </h3>
      <p class="text-gray-500 mb-6">
        Add a delivery address to speed up checkout
      </p>
      <button onclick="showAddForm()"
              class="bg-indigo-600 text-white px-6 py-3
                     rounded-xl hover:bg-indigo-700 transition
                     font-medium">
        Add Your First Address
      </button>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/buyer/addresses.js"></script>
</body>
</html>
