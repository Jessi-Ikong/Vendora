<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="max-w-7xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold text-gray-900">My Cart</h1>
      <a href="../products.html"
         class="text-indigo-600 hover:underline text-sm">
        ← Continue Shopping
      </a>
    </div>

    <!-- Empty Cart State -->
    <div id="empty-cart" class="hidden text-center py-20">
      <p class="text-6xl mb-4">🛒</p>
      <h3 class="text-xl font-bold text-gray-700 mb-2">
        Your cart is empty
      </h3>
      <p class="text-gray-500 mb-6">
        Add some products to get started
      </p>
      <a href="../products.html"
         class="bg-indigo-600 text-white px-8 py-3 rounded-xl
                hover:bg-indigo-700 transition inline-block
                font-medium">
        Browse Products
      </a>
    </div>

    <!-- Cart Content -->
    <div id="cart-content" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- ─── Cart Items ─── -->
        <div class="lg:col-span-2 space-y-4"
             id="cart-items">
        </div>

        <!-- ─── Order Summary ─── -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-xl shadow-sm border
                      border-gray-100 p-6 sticky top-20">
            <h2 class="text-lg font-bold text-gray-900 mb-6">
              Order Summary
            </h2>

            <div class="space-y-3 mb-6">
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">
                  Subtotal (<span id="item-count">0</span> items)
                </span>
                <span class="font-medium" id="subtotal"></span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-500">Delivery</span>
                <span class="text-green-600 font-medium">Free</span>
              </div>
              <div class="border-t border-gray-100 pt-3
                          flex justify-between">
                <span class="font-bold text-gray-900">Total</span>
                <span class="font-bold text-xl text-indigo-600"
                      id="total"></span>
              </div>
            </div>

            <a href="checkout.html"
               id="checkout-btn"
               class="block w-full bg-indigo-600 text-white
                      py-3 rounded-xl font-semibold text-center
                      hover:bg-indigo-700 transition">
              Proceed to Checkout →
            </a>

            <button onclick="clearCart()"
                    class="block w-full mt-3 text-center text-sm
                           text-red-500 hover:text-red-700 transition">
              Clear Cart
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/buyer/cart.js"></script>
</body>
</html>
