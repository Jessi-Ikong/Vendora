<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="max-w-5xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">My Orders</h1>
        <p class="text-gray-500 mt-1">Track and manage your orders</p>
      </div>
      <a href="../products.html"
         class="bg-indigo-600 text-white px-4 py-2 rounded-xl
                text-sm font-medium hover:bg-indigo-700 transition">
        🛒 Continue Shopping
      </a>
    </div>

    <!-- Filter Tabs -->
    <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
      <button onclick="filterOrders('all')"
              id="tab-all"
              class="px-4 py-2 rounded-lg text-sm font-medium
                     whitespace-nowrap transition
                     bg-indigo-600 text-white">
        All Orders
      </button>
      <button onclick="filterOrders('pending')"
              id="tab-pending"
              class="px-4 py-2 rounded-lg text-sm font-medium
                     whitespace-nowrap transition
                     bg-white text-gray-600 border border-gray-200
                     hover:border-indigo-300">
        Pending
      </button>
      <button onclick="filterOrders('processing')"
              id="tab-processing"
              class="px-4 py-2 rounded-lg text-sm font-medium
                     whitespace-nowrap transition
                     bg-white text-gray-600 border border-gray-200
                     hover:border-indigo-300">
        Processing
      </button>
      <button onclick="filterOrders('shipped')"
              id="tab-shipped"
              class="px-4 py-2 rounded-lg text-sm font-medium
                     whitespace-nowrap transition
                     bg-white text-gray-600 border border-gray-200
                     hover:border-indigo-300">
        Shipped
      </button>
      <button onclick="filterOrders('delivered')"
              id="tab-delivered"
              class="px-4 py-2 rounded-lg text-sm font-medium
                     whitespace-nowrap transition
                     bg-white text-gray-600 border border-gray-200
                     hover:border-indigo-300">
        Delivered
      </button>
      <button onclick="filterOrders('cancelled')"
              id="tab-cancelled"
              class="px-4 py-2 rounded-lg text-sm font-medium
                     whitespace-nowrap transition
                     bg-white text-gray-600 border border-gray-200
                     hover:border-indigo-300">
        Cancelled
      </button>
    </div>

    <!-- Orders List -->
    <div id="orders-list" class="space-y-4"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-20">
      <p class="text-5xl mb-4">📦</p>
      <h3 class="text-xl font-bold text-gray-700 mb-2">
        No orders found
      </h3>
      <p class="text-gray-500 mb-6">
        You haven't placed any orders yet
      </p>
      <a href="../products.html"
         class="bg-indigo-600 text-white px-8 py-3 rounded-xl
                hover:bg-indigo-700 transition inline-block font-medium">
        Start Shopping
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/buyer/orders.js"></script>
</body>
</html>
