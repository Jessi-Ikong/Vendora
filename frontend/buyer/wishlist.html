<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">My Wishlist</h1>
        <p class="text-gray-500 mt-1" id="wishlist-count"></p>
      </div>
      <a href="../products.html"
         class="bg-indigo-600 text-white px-4 py-2 rounded-xl
                text-sm font-medium hover:bg-indigo-700 transition">
        🛒 Continue Shopping
      </a>
    </div>

    <!-- Empty State -->
    <div id="empty-wishlist" class="hidden text-center py-20">
      <p class="text-6xl mb-4">🤍</p>
      <h3 class="text-xl font-bold text-gray-700 mb-2">
        Your wishlist is empty
      </h3>
      <p class="text-gray-500 mb-6">
        Save products you love to your wishlist
      </p>
      <a href="../products.html"
         class="bg-indigo-600 text-white px-8 py-3 rounded-xl
                hover:bg-indigo-700 transition inline-block font-medium">
        Browse Products
      </a>
    </div>

    <!-- Wishlist Grid -->
    <div id="wishlist-grid"
         class="grid grid-cols-2 sm:grid-cols-3
                md:grid-cols-4 gap-4">
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/buyer/wishlist.js"></script>
</body>
</html>
