<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="max-w-7xl mx-auto px-4 py-8">

    <!-- Breadcrumb -->
    <nav class="text-sm text-gray-500 mb-6">
      <a href="index.html" class="hover:text-indigo-600">Home</a>
      <span class="mx-2">→</span>
      <a href="products.html" class="hover:text-indigo-600">
        Products
      </a>
      <span class="mx-2">→</span>
      <span id="breadcrumb-name" class="text-gray-900"></span>
    </nav>

    <!-- Category Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600
                rounded-2xl p-8 text-white mb-8">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-white bg-opacity-20 rounded-xl
                    flex items-center justify-center text-4xl">
          📦
        </div>
        <div>
          <h1 class="text-3xl font-bold" id="category-name"></h1>
          <p class="text-indigo-100 mt-1" id="category-description">
          </p>
          <p class="text-indigo-200 text-sm mt-2"
             id="category-count"></p>
        </div>
      </div>
    </div>

    <!-- Subcategories -->
    <div id="subcategories-section" class="hidden mb-8">
      <h2 class="text-lg font-bold text-gray-900 mb-4">
        Subcategories
      </h2>
      <div id="subcategories-grid"
           class="flex flex-wrap gap-3"></div>
    </div>

    <div class="flex gap-8">

      <!-- Sidebar Filters -->
      <aside class="hidden lg:block w-64 flex-shrink-0">
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6 sticky top-20">
          <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-gray-900">Filters</h3>
            <button onclick="clearFilters()"
                    class="text-sm text-indigo-600 hover:underline">
              Clear all
            </button>
          </div>

          <!-- Price Filter -->
          <div class="mb-6">
            <h4 class="font-medium text-gray-700 mb-3">
              Price Range
            </h4>
            <div class="space-y-3">
              <div>
                <label class="text-sm text-gray-500">Min (₦)</label>
                <input type="number" id="min-price"
                       placeholder="0"
                       class="w-full mt-1 px-3 py-2 border
                              border-gray-300 rounded-lg text-sm
                              focus:outline-none focus:ring-2
                              focus:ring-indigo-500"/>
              </div>
              <div>
                <label class="text-sm text-gray-500">Max (₦)</label>
                <input type="number" id="max-price"
                       placeholder="Any"
                       class="w-full mt-1 px-3 py-2 border
                              border-gray-300 rounded-lg text-sm
                              focus:outline-none focus:ring-2
                              focus:ring-indigo-500"/>
              </div>
              <button onclick="applyFilters()"
                      class="w-full bg-indigo-600 text-white py-2
                             rounded-lg text-sm hover:bg-indigo-700
                             transition">
                Apply
              </button>
            </div>
          </div>

          <!-- Sort -->
          <div>
            <h4 class="font-medium text-gray-700 mb-3">Sort By</h4>
            <select id="sort-select" onchange="applyFilters()"
                    class="w-full border border-gray-300 rounded-lg
                           px-3 py-2 text-sm focus:outline-none
                           focus:ring-2 focus:ring-indigo-500">
              <option value="">Newest</option>
              <option value="popular">Most Popular</option>
              <option value="rated">Top Rated</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
            </select>
          </div>
        </div>
      </aside>

      <!-- Products Grid -->
      <div class="flex-1">
        <div id="products-grid"
             class="grid grid-cols-2 sm:grid-cols-2
                    md:grid-cols-3 gap-4 mb-8">
        </div>
        <div id="pagination"></div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/loader.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/pagination.js"></script>
  <script src="js/pages/category.js"></script>
</body>
</html>
