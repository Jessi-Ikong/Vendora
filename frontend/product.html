<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <!-- Product Detail -->
  <div class="max-w-7xl mx-auto px-4 py-8" id="product-container">

    <!-- Loading skeleton -->
    <div id="product-skeleton" class="animate-pulse">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-gray-200 rounded-2xl h-96"></div>
        <div class="space-y-4">
          <div class="h-8 bg-gray-200 rounded w-3/4"></div>
          <div class="h-6 bg-gray-200 rounded w-1/4"></div>
          <div class="h-4 bg-gray-200 rounded w-full"></div>
          <div class="h-4 bg-gray-200 rounded w-full"></div>
          <div class="h-4 bg-gray-200 rounded w-2/3"></div>
        </div>
      </div>
    </div>

    <!-- Product Content (hidden until loaded) -->
    <div id="product-content" class="hidden">

      <!-- Breadcrumb -->
      <nav class="text-sm text-gray-500 mb-6">
        <a href="index.html" class="hover:text-indigo-600">Home</a>
        <span class="mx-2">→</span>
        <a href="products.html" class="hover:text-indigo-600">Products</a>
        <span class="mx-2">→</span>
        <span id="breadcrumb-name" class="text-gray-900"></span>
      </nav>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">

        <!-- ─── Image Gallery ─── -->
        <div x-data="{ selected: 0 }">
          <!-- Main Image -->
          <div class="bg-white rounded-2xl overflow-hidden
                      border border-gray-100 shadow-sm mb-3 h-96">
            <img id="main-image"
                 src="" alt=""
                 class="w-full h-full object-contain p-4"/>
          </div>

          <!-- Thumbnails -->
          <div id="thumbnails"
               class="flex gap-2 overflow-x-auto pb-2">
          </div>
        </div>

        <!-- ─── Product Info ─── -->
        <div>
          <!-- Store -->
          <a id="store-link" href="#"
             class="text-indigo-600 text-sm font-medium
                    hover:underline mb-2 block">
          </a>

          <!-- Name -->
          <h1 id="product-name"
              class="text-2xl font-bold text-gray-900 mb-3">
          </h1>

          <!-- Rating -->
          <div class="flex items-center gap-3 mb-4">
            <div class="flex items-center gap-1">
              <span id="product-stars"
                    class="text-yellow-400 text-lg"></span>
              <span id="product-rating"
                    class="text-gray-500 text-sm"></span>
            </div>
            <span class="text-gray-300">|</span>
            <span id="product-sold"
                  class="text-gray-500 text-sm"></span>
          </div>

          <!-- Price -->
          <div class="flex items-center gap-3 mb-6">
            <span id="product-price"
                  class="text-3xl font-bold text-indigo-600"></span>
            <span id="product-original-price"
                  class="text-gray-400 line-through text-lg"></span>
            <span id="product-discount"
                  class="bg-red-100 text-red-600 text-sm
                         font-medium px-2 py-1 rounded-lg"></span>
          </div>

          <!-- Stock -->
          <div class="mb-6">
            <span id="stock-badge" class="text-sm font-medium"></span>
          </div>

          <!-- Quantity -->
          <div class="flex items-center gap-4 mb-6"
               x-data="{ qty: 1 }">
            <label class="text-sm font-medium text-gray-700">
              Quantity:
            </label>
            <div class="flex items-center border border-gray-300
                        rounded-lg overflow-hidden">
              <button @click="qty = Math.max(1, qty - 1)"
                      class="px-4 py-2 bg-gray-50 hover:bg-gray-100
                             text-gray-600 font-bold transition">
                −
              </button>
              <span x-text="qty"
                    class="px-6 py-2 font-semibold text-gray-900">
              </span>
              <button @click="qty = Math.min(maxStock, qty + 1)"
                      class="px-4 py-2 bg-gray-50 hover:bg-gray-100
                             text-gray-600 font-bold transition">
                +
              </button>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 flex-1">
              <button onclick="addToCart()"
                      id="add-to-cart-btn"
                      class="flex-1 bg-indigo-600 text-white py-3
                             rounded-xl font-semibold hover:bg-indigo-700
                             transition disabled:opacity-50">
                🛒 Add to Cart
              </button>
              <button onclick="toggleWishlist()"
                      id="wishlist-btn"
                      class="p-3 border border-gray-300 rounded-xl
                             hover:border-red-400 hover:text-red-500
                             transition text-xl">
                🤍
              </button>
            </div>
          </div>

          <!-- Description -->
          <div class="border-t border-gray-100 pt-6">
            <h3 class="font-semibold text-gray-900 mb-3">
              Description
            </h3>
            <p id="product-description"
               class="text-gray-600 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <!-- ─── Reviews Section ─── -->
      <div class="bg-white rounded-2xl shadow-sm border
                  border-gray-100 p-6 mb-8">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold text-gray-900">
            Customer Reviews
          </h2>
          <button onclick="showReviewForm()"
                  id="write-review-btn"
                  class="bg-indigo-600 text-white px-4 py-2
                         rounded-lg text-sm hover:bg-indigo-700
                         transition hidden">
            Write a Review
          </button>
        </div>

        <!-- Rating Summary -->
        <div class="flex items-center gap-6 mb-8 pb-6
                    border-b border-gray-100">
          <div class="text-center">
            <p id="avg-rating"
               class="text-5xl font-bold text-gray-900"></p>
            <p id="avg-stars" class="text-yellow-400 text-xl"></p>
            <p id="review-count"
               class="text-sm text-gray-500 mt-1"></p>
          </div>
          <div id="rating-breakdown" class="flex-1 space-y-2">
          </div>
        </div>

        <!-- Review Form (hidden by default) -->
        <div id="review-form" class="hidden mb-8 p-4 bg-gray-50
                                     rounded-xl">
          <h4 class="font-semibold mb-4">Your Review</h4>
          <div class="mb-4">
            <label class="text-sm text-gray-600 mb-2 block">
              Rating
            </label>
            <div class="flex gap-2" id="star-selector">
  <button onclick="setRating(1)" data-star="1"
          class="text-3xl text-gray-300 hover:text-yellow-400
                 transition star-btn">★</button>
  <button onclick="setRating(2)" data-star="2"
          class="text-3xl text-gray-300 hover:text-yellow-400
                 transition star-btn">★</button>
  <button onclick="setRating(3)" data-star="3"
          class="text-3xl text-gray-300 hover:text-yellow-400
                 transition star-btn">★</button>
  <button onclick="setRating(4)" data-star="4"
          class="text-3xl text-gray-300 hover:text-yellow-400
                 transition star-btn">★</button>
  <button onclick="setRating(5)" data-star="5"
          class="text-3xl text-gray-300 hover:text-yellow-400
                 transition star-btn">★</button>
</div>
            <input type="hidden" id="selected-rating" value="0"/>
          </div>
          <textarea id="review-comment"
                    placeholder="Share your experience..."
                    rows="4"
                    class="w-full px-4 py-3 border border-gray-300
                           rounded-lg focus:outline-none
                           focus:ring-2 focus:ring-indigo-500
                           resize-none mb-4"></textarea>
          <div class="flex gap-3">
            <button onclick="submitReview()"
                    class="bg-indigo-600 text-white px-6 py-2
                           rounded-lg hover:bg-indigo-700 transition">
              Submit Review
            </button>
            <button onclick="hideReviewForm()"
                    class="border border-gray-300 px-6 py-2
                           rounded-lg hover:bg-gray-50 transition">
              Cancel
            </button>
          </div>
        </div>

        <!-- Reviews List -->
        <div id="reviews-list" class="space-y-6">
        </div>

      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/loader.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/pages/product.js"></script>
</body>
</html>
