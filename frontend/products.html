<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products — Vendora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="bg-gray-50">
    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-4 py-8">
      <!-- Page Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">All Products</h1>
        <p class="text-gray-500 mt-1" id="results-count"></p>
      </div>

      <div class="flex gap-8">
        <!-- ─── Sidebar Filters ─── -->
        <aside class="hidden lg:block w-64 flex-shrink-0">
          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sticky top-20"
          >
            <div class="flex items-center justify-between mb-6">
              <h3 class="font-bold text-gray-900">Filters</h3>
              <button
                onclick="clearFilters()"
                class="text-sm text-indigo-600 hover:underline"
              >
                Clear all
              </button>
            </div>

            <!-- Category Filter -->
            <div class="mb-6">
              <h4 class="font-medium text-gray-700 mb-3">Category</h4>
              <div id="category-filters" class="space-y-2">
                <!-- Populated by JS -->
              </div>
            </div>

            <!-- Price Filter -->
            <div class="mb-6">
              <h4 class="font-medium text-gray-700 mb-3">Price Range</h4>
              <div class="space-y-3">
                <div>
                  <label class="text-sm text-gray-500">Min Price (₦)</label>
                  <input
                    type="number"
                    id="min-price"
                    placeholder="0"
                    class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label class="text-sm text-gray-500">Max Price (₦)</label>
                  <input
                    type="number"
                    id="max-price"
                    placeholder="Any"
                    class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <button
                  onclick="applyFilters()"
                  class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm hover:bg-indigo-700 transition"
                >
                  Apply
                </button>
              </div>
            </div>

            <!-- Rating Filter -->
            <!-- Rating Filter -->
            <div class="mb-6">
              <h4 class="font-medium text-gray-700 mb-3">Min Rating</h4>
              <div class="space-y-2">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    name="rating"
                    value="5"
                    onchange="applyFilters()"
                    class="text-indigo-600"
                  />
                  <span class="text-yellow-400">★★★★★</span>
                  <span class="text-sm text-gray-500">& up</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    name="rating"
                    value="4"
                    onchange="applyFilters()"
                    class="text-indigo-600"
                  />
                  <span class="text-yellow-400">★★★★☆</span>
                  <span class="text-sm text-gray-500">& up</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    name="rating"
                    value="3"
                    onchange="applyFilters()"
                    class="text-indigo-600"
                  />
                  <span class="text-yellow-400">★★★☆☆</span>
                  <span class="text-sm text-gray-500">& up</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    name="rating"
                    value="2"
                    onchange="applyFilters()"
                    class="text-indigo-600"
                  />
                  <span class="text-yellow-400">★★☆☆☆</span>
                  <span class="text-sm text-gray-500">& up</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    name="rating"
                    value="1"
                    onchange="applyFilters()"
                    class="text-indigo-600"
                  />
                  <span class="text-yellow-400">★☆☆☆☆</span>
                  <span class="text-sm text-gray-500">& up</span>
                </label>
              </div>
            </div>
          </div>
        </aside>

        <!-- ─── Main Content ─── -->
        <div class="flex-1">
          <!-- Sort & View Controls -->
          <div
            class="flex items-center justify-between mb-6 bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3"
          >
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-500">Sort by:</label>
              <select
                id="sort-select"
                onchange="applyFilters()"
                class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="">Newest</option>
                <option value="popular">Most Popular</option>
                <option value="rated">Top Rated</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
              </select>
            </div>
            <span class="text-sm text-gray-500" id="page-info"></span>
          </div>

          <!-- Products Grid -->
          <div
            id="products-grid"
            class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4 mb-8"
          >
            <!-- Populated by JS -->
          </div>

          <!-- Pagination -->
          <div id="pagination"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/loader.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/productCard.js"></script>
    <script src="js/components/pagination.js"></script>
    <script src="js/pages/products.js"></script>
  </body>
</html>
