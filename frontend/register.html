<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="text-3xl font-bold text-indigo-600">Vendora</a>
      <p class="text-gray-500 mt-2">Create your account</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Sign Up</h2>

      <form id="register-form" class="space-y-5">

        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Full Name
          </label>
          <input type="text" id="name" placeholder="John Doe"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-2 focus:ring-indigo-500
                        transition"/>
          <p id="name-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Email Address
          </label>
          <input type="email" id="email" placeholder="you@example.com"
                 class="w-full px-4 py-3 border border-gray-300 rounded-lg
                        focus:outline-none focus:ring-2 focus:ring-indigo-500
                        transition"/>
          <p id="email-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>
          <div class="relative" x-data="{ show: false }">
            <input :type="show ? 'text' : 'password'"
                   id="password" placeholder="Min. 6 characters"
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg
                          focus:outline-none focus:ring-2 focus:ring-indigo-500
                          transition pr-12"/>
            <button type="button" @click="show = !show"
                    class="absolute right-3 top-3.5 text-gray-400
                           hover:text-gray-600">
              <span x-text="show ? '🙈' : '👁️'"></span>
            </button>
          </div>
          <p id="password-error" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <!-- Role -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">
            I want to
          </label>
          <div class="grid grid-cols-2 gap-3" x-data="{ role: 'buyer' }">
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="buyer"
                     x-model="role" class="sr-only"/>
              <div :class="role === 'buyer'
                           ? 'border-indigo-600 bg-indigo-50'
                           : 'border-gray-200'"
                   class="border-2 rounded-xl p-4 text-center transition">
                <div class="text-2xl mb-1">🛒</div>
                <div class="font-medium text-sm">Shop</div>
                <div class="text-xs text-gray-500">Buy products</div>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="vendor"
                     x-model="role" class="sr-only"/>
              <div :class="role === 'vendor'
                           ? 'border-indigo-600 bg-indigo-50'
                           : 'border-gray-200'"
                   class="border-2 rounded-xl p-4 text-center transition">
                <div class="text-2xl mb-1">🏪</div>
                <div class="font-medium text-sm">Sell</div>
                <div class="text-xs text-gray-500">Open a store</div>
              </div>
            </label>
          </div>
        </div>

        <!-- Terms -->
        <div class="flex items-start gap-3">
          <input type="checkbox" id="terms"
                 class="mt-1 rounded border-gray-300
                        text-indigo-600 focus:ring-indigo-500"/>
          <label for="terms" class="text-sm text-gray-600">
            I agree to the
            <a href="#" class="text-indigo-600 hover:underline">
              Terms of Service
            </a>
            and
            <a href="#" class="text-indigo-600 hover:underline">
              Privacy Policy
            </a>
          </label>
        </div>
        <p id="terms-error" class="text-red-500 text-xs hidden"></p>

        <!-- Submit -->
        <button type="submit" id="register-btn"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg
                       font-semibold hover:bg-indigo-700 transition
                       disabled:opacity-50 disabled:cursor-not-allowed">
          Create Account
        </button>

      </form>

      <!-- Divider -->
      <div class="my-6 flex items-center gap-4">
        <hr class="flex-1 border-gray-200">
        <span class="text-gray-400 text-sm">or</span>
        <hr class="flex-1 border-gray-200">
      </div>

      <!-- Login link -->
      <p class="text-center text-gray-600 text-sm">
        Already have an account?
        <a href="login.html"
           class="text-indigo-600 font-medium hover:underline">
          Sign In
        </a>
      </p>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/loader.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
