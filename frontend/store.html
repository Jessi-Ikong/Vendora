<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <!-- Store Banner -->
  <div id="store-banner"
       class="h-48 bg-gradient-to-r from-indigo-600 to-purple-600
              relative overflow-hidden">
    <img id="banner-img" src="" alt=""
         class="w-full h-full object-cover hidden"/>
  </div>

  <div class="max-w-7xl mx-auto px-4">

    <!-- Store Header -->
    <div class="bg-white rounded-2xl shadow-sm border
                border-gray-100 p-6 -mt-8 mb-8 relative">
      <div class="flex items-start gap-6">

        <!-- Store Logo -->
        <div class="w-20 h-20 bg-indigo-100 rounded-xl flex
                    items-center justify-center text-3xl font-bold
                    text-indigo-600 flex-shrink-0 -mt-10 border-4
                    border-white shadow-md" id="store-logo">
          🏪
        </div>

        <!-- Store Info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-gray-900"
                  id="store-name">
              </h1>
              <p class="text-gray-500 mt-1" id="store-description">
              </p>
            </div>
            <div class="text-right flex-shrink-0">
              <p class="text-2xl font-bold text-indigo-600"
                 id="store-products">—</p>
              <p class="text-sm text-gray-400">Products</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Search Within Store -->
    <div class="flex gap-3 mb-8">
      <input type="text" id="store-search"
             placeholder="Search in this store..."
             class="flex-1 px-4 py-3 border border-gray-300
                    rounded-xl focus:outline-none focus:ring-2
                    focus:ring-indigo-500"/>
      <button onclick="searchStore()"
              class="bg-indigo-600 text-white px-6 py-3
                     rounded-xl hover:bg-indigo-700 transition
                     font-medium">
        Search
      </button>
    </div>

    <!-- Products Grid -->
    <div id="products-grid"
         class="grid grid-cols-2 sm:grid-cols-3
                md:grid-cols-4 gap-4 mb-8">
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <p class="text-5xl mb-4">📦</p>
      <h3 class="text-xl font-bold text-gray-700 mb-2">
        No products yet
      </h3>
      <p class="text-gray-500">
        This store hasn't listed any products yet
      </p>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/loader.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/pages/store.js"></script>
</body>
</html>
