<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product — Vendora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="bg-gray-50">
    <div id="navbar"></div>

    <!-- Mobile Menu State (Alpine.js) -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape="sidebarOpen = false">
      <!-- Mobile Hamburger Button -->
      <button
        @click="sidebarOpen = !sidebarOpen"
        class="lg:hidden fixed top-20 left-4 z-40 p-2.5 bg-indigo-600 text-white rounded-lg shadow-lg hover:bg-indigo-700 transition"
      >
        <span
          x-text="sidebarOpen ? '✕' : '☰'"
          class="text-xl font-bold"
        ></span>
      </button>

      <!-- Mobile Backdrop -->
      <div
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        class="lg:hidden fixed inset-0 bg-black bg-opacity-40 z-30 transition-opacity"
        style="display: none"
      ></div>

      <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside
          class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto transform transition-transform duration-300 ease-out lg:translate-x-0 lg:relative lg:z-auto"
          :class="sidebarOpen ? 'translate-x-0 z-40' : '-translate-x-full z-40'"
        >
          <div class="p-6">
            <p
              class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4"
            >
              Vendor Menu
            </p>
            <nav class="space-y-1">
              <a
                href="dashboard.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>📊</span> Dashboard
              </a>
              <a
                href="products.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"
              >
                <span>📦</span> Products
              </a>
              <a
                href="orders.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🛍️</span> Orders
              </a>
              <a
                href="store-profile.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🏪</span> Store Profile
              </a>
              <a
                href="add-product.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>➕</span> Add Product
              </a>
              <hr class="my-3 border-gray-100" />
              <a
                href="../index.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🏠</span> Back to Store
              </a>
              <button
                onclick="Auth.logout()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition w-full text-left"
              >
                <span>🚪</span> Logout
              </button>
            </nav>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 p-6">
          <!-- Header -->
          <div class="flex items-center gap-4 mb-8">
            <a
              href="products.html"
              class="text-gray-400 hover:text-gray-600 transition"
            >
              ←
            </a>
            <h1 class="text-3xl font-bold text-gray-900">Edit Product</h1>
          </div>

          <form id="product-form" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left — Main Details -->
            <div class="lg:col-span-2 space-y-6">
              <!-- Basic Info -->
              <div
                class="bg-white rounded-xl shadow-sm border border-gray-100 p-6"
              >
                <h2 class="text-lg font-bold text-gray-900 mb-4">
                  Basic Information
                </h2>
                <div class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                      Product Name *
                    </label>
                    <input
                      type="text"
                      id="product-name"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                      Description
                    </label>
                    <textarea
                      id="product-description"
                      rows="5"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                    >
                    </textarea>
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                      Category
                    </label>
                    <select
                      id="product-category"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="">Select a category</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Pricing -->
              <div
                class="bg-white rounded-xl shadow-sm border border-gray-100 p-6"
              >
                <h2 class="text-lg font-bold text-gray-900 mb-4">Pricing</h2>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                      Regular Price (₦) *
                    </label>
                    <input
                      type="number"
                      id="product-price"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                      Sale Price (₦)
                      <span class="text-gray-400 font-normal"> Optional </span>
                    </label>
                    <input
                      type="number"
                      id="product-discount"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                </div>
              </div>

              <!-- Images -->
              <div
                class="bg-white rounded-xl shadow-sm border border-gray-100 p-6"
              >
                <h2 class="text-lg font-bold text-gray-900 mb-4">
                  Product Images
                </h2>

                <!-- Current Images -->
                <div
                  id="current-images"
                  class="flex flex-wrap gap-3 mb-4"
                ></div>

                <!-- Add New Image -->
                <!-- Add New Image — File Upload -->
                <div class="space-y-3">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                      Upload from device
                    </label>
                    <div class="flex gap-3">
                      <input
                        type="file"
                        id="new-image-file"
                        accept="image/*"
                        class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                      <button
                        type="button"
                        onclick="uploadNewImage()"
                        class="bg-indigo-600 text-white px-4 py-2.5 rounded-lg hover:bg-indigo-700 transition text-sm whitespace-nowrap"
                      >
                        Upload
                      </button>
                    </div>
                  </div>

                  <div class="flex items-center gap-3">
                    <hr class="flex-1 border-gray-200" />
                    <span class="text-xs text-gray-400">or paste URL</span>
                    <hr class="flex-1 border-gray-200" />
                  </div>

                  <div class="flex gap-3">
                    <input
                      type="text"
                      id="new-image-url"
                      placeholder="https://..."
                      class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                    />
                    <button
                      type="button"
                      onclick="addImageByUrl()"
                      class="bg-gray-100 text-gray-700 px-4 py-2.5 rounded-lg hover:bg-gray-200 transition text-sm whitespace-nowrap"
                    >
                      Add URL
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right — Settings -->
            <div class="space-y-6">
              <!-- Stock & Status -->
              <div
                class="bg-white rounded-xl shadow-sm border border-gray-100 p-6"
              >
                <h2 class="text-lg font-bold text-gray-900 mb-4">Settings</h2>
                <div class="space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                      Stock Quantity *
                    </label>
                    <input
                      type="number"
                      id="product-stock"
                      min="0"
                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <!-- Published Status -->
                  <div
                    class="flex items-center justify-between p-3 bg-gray-50 rounded-lg"
                  >
                    <div>
                      <p class="text-sm font-medium text-gray-700">Published</p>
                      <p class="text-xs text-gray-400">Visible to buyers</p>
                    </div>
                    <div x-data="{ on: false }" id="publish-toggle">
                      <button
                        type="button"
                        @click="on = !on"
                        :class="on
                                  ? 'bg-indigo-600'
                                  : 'bg-gray-200'"
                        class="relative w-12 h-6 rounded-full transition"
                      >
                        <span
                          :class="on
                                  ? 'translate-x-6'
                                  : 'translate-x-1'"
                          class="absolute top-1 w-4 h-4 bg-white rounded-full transition transform shadow"
                        >
                        </span>
                      </button>
                      <input
                        type="hidden"
                        id="product-publish"
                        :value="on ? 'true' : 'false'"
                        x-effect="$el.value = on
                                   ? 'true' : 'false'"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <!-- Actions -->
              <button
                type="submit"
                id="submit-btn"
                class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700 transition disabled:opacity-50"
              >
                Save Changes
              </button>

              <a
                href="products.html"
                class="block w-full text-center py-3 border border-gray-300 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                Cancel
              </a>
            </div>
          </form>
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/router.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/loader.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/vendor/edit-product.js"></script>
  </body>
</html>
