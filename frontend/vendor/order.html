<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100
                  fixed top-16 left-0 bottom-0 overflow-y-auto
                  hidden lg:block">
      <div class="p-6">
        <p class="text-xs font-semibold text-gray-400 uppercase
                  tracking-wider mb-4">Vendor Menu</p>
        <nav class="space-y-1">
          <a href="dashboard.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>📊</span> Dashboard
          </a>
          <a href="products.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>📦</span> Products
          </a>
          <a href="orders.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    bg-indigo-50 text-indigo-600 font-medium">
            <span>🛍️</span> Orders
          </a>
          <a href="store-profile.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>🏪</span> Store Profile
          </a>
          <a href="add-product.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>➕</span> Add Product
          </a>
          <hr class="my-3 border-gray-100">
          <a href="../index.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>🏠</span> Back to Store
          </a>
          <button onclick="Auth.logout()"
                  class="flex items-center gap-3 px-4 py-3 rounded-xl
                         text-red-500 hover:bg-red-50 transition
                         w-full text-left">
            <span>🚪</span> Logout
          </button>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 p-6">

      <!-- Header -->
      <div class="flex items-center gap-4 mb-8">
        <a href="orders.html"
           class="text-gray-400 hover:text-gray-600 transition">
          ←
        </a>
        <h1 class="text-3xl font-bold text-gray-900">
          Order Details
        </h1>
      </div>

      <!-- Order Content -->
      <div class="max-w-3xl space-y-6">

        <!-- Order Meta -->
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-lg font-bold text-gray-900">
              Order Summary
            </h2>
            <span id="payment-badge"
                  class="px-3 py-1 rounded-full text-sm
                         font-medium">
            </span>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div>
              <p class="text-xs text-gray-400 mb-1">Order ID</p>
              <p class="font-bold text-gray-900" id="order-id"></p>
            </div>
            <div>
              <p class="text-xs text-gray-400 mb-1">Date</p>
              <p class="font-medium text-gray-700" id="order-date">
              </p>
            </div>
            <div>
              <p class="text-xs text-gray-400 mb-1">Buyer</p>
              <p class="font-medium text-gray-700" id="buyer-name">
              </p>
            </div>
            <div>
              <p class="text-xs text-gray-400 mb-1">
                Your Earnings
              </p>
              <p class="font-bold text-indigo-600 text-lg"
                 id="order-total"></p>
            </div>
          </div>
        </div>

        <!-- Order Items -->
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-4">
            Items from Your Store
          </h2>
          <div id="order-items" class="space-y-4"></div>
        </div>

        <!-- Update Status -->
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6" id="status-section">
          <h2 class="text-lg font-bold text-gray-900 mb-4">
            Update Fulfilment Status
          </h2>

          <div class="space-y-3" id="status-buttons"></div>
        </div>

        <!-- Buyer Info -->
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-4">
            👤 Buyer Information
          </h2>
          <div id="buyer-info" class="space-y-2 text-sm
                                      text-gray-600">
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/vendor/order.js"></script>
</body>
</html>
