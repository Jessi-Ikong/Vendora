<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Orders — Vendora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="bg-gray-50">
    <div id="navbar"></div>

    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto hidden lg:block"
      >
        <div class="p-6">
          <p
            class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4"
          >
            Vendor Menu
          </p>
          <nav class="space-y-1">
            <a
              href="dashboard.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>📊</span> Dashboard
            </a>
            <a
              href="products.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>📦</span> Products
            </a>
            <a
              href="orders.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"
            >
              <span>🛍️</span> Orders
            </a>
            <a
              href="store-profile.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>🏪</span> Store Profile
            </a>
            <a
              href="add-product.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>➕</span> Add Product
            </a>
            <hr class="my-3 border-gray-100" />
            <a
              href="../index.html"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
            >
              <span>🏠</span> Back to Store
            </a>
            <button
              onclick="Auth.logout()"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition w-full text-left"
            >
              <span>🚪</span> Logout
            </button>
          </nav>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 lg:ml-64 p-6">
        <!-- Header -->
        <div class="mb-8">
          <h1 class="text-3xl font-bold text-gray-900">Orders</h1>
          <p class="text-gray-500 mt-1">Manage and fulfil customer orders</p>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
          <button
            onclick="filterOrders('all')"
            id="tab-all"
            class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap bg-indigo-600 text-white"
          >
            All
          </button>
          <button
            onclick="filterOrders('pending')"
            id="tab-pending"
            class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:border-indigo-300"
          >
            Pending
          </button>
          <button
            onclick="filterOrders('processing')"
            id="tab-processing"
            class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:border-indigo-300"
          >
            Processing
          </button>
          <button
            onclick="filterOrders('shipped')"
            id="tab-shipped"
            class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:border-indigo-300"
          >
            Shipped
          </button>
          <button
            onclick="filterOrders('delivered')"
            id="tab-delivered"
            class="px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:border-indigo-300"
          >
            Delivered
          </button>
        </div>

        <!-- Orders Table -->
        <div
          class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
        >
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-gray-100">
                <tr>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Product
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Buyer
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Reference
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Amount
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Date
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Status
                  </th>
                  <th
                    class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                  >
                    Action
                  </th>
                </tr>
              </thead>
              <tbody id="orders-table"></tbody>
            </table>
          </div>

          <!-- Empty State -->
          <div id="empty-state" class="hidden text-center py-16">
            <p class="text-4xl mb-3">🛍️</p>
            <p class="font-medium text-gray-700">No orders yet</p>
            <p class="text-sm text-gray-400 mt-1">
              Orders will appear here when customers purchase your products
            </p>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/router.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/loader.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/vendor/orders.js"></script>
  </body>
</html>
