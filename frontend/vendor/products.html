<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Products — Vendora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="bg-gray-50">
    <div id="navbar"></div>

    <!-- Mobile Menu State (Alpine.js) -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape="sidebarOpen = false">
      <!-- Mobile Hamburger Button -->
      <button
        @click="sidebarOpen = !sidebarOpen"
        class="lg:hidden fixed top-20 left-4 z-40 p-2.5 bg-indigo-600 text-white rounded-lg shadow-lg hover:bg-indigo-700 transition"
      >
        <span
          x-text="sidebarOpen ? '✕' : '☰'"
          class="text-xl font-bold"
        ></span>
      </button>

      <!-- Mobile Backdrop -->
      <div
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        class="lg:hidden fixed inset-0 bg-black bg-opacity-40 z-30 transition-opacity"
        style="display: none"
      ></div>

      <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside
          class="w-64 bg-white border-r border-gray-100 fixed top-16 left-0 bottom-0 overflow-y-auto transform transition-transform duration-300 ease-out lg:translate-x-0 lg:relative lg:z-auto"
          :class="sidebarOpen ? 'translate-x-0 z-40' : '-translate-x-full z-40'"
        >
          <div class="p-6">
            <p
              class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4"
            >
              Vendor Menu
            </p>
            <nav class="space-y-1">
              <a
                href="dashboard.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>📊</span> Dashboard
              </a>
              <a
                href="products.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-medium"
              >
                <span>📦</span> Products
              </a>
              <a
                href="orders.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🛍️</span> Orders
              </a>
              <a
                href="store-profile.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🏪</span> Store Profile
              </a>
              <a
                href="add-product.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>➕</span> Add Product
              </a>
              <hr class="my-3 border-gray-100" />
              <a
                href="../index.html"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 transition"
              >
                <span>🏠</span> Back to Store
              </a>
              <button
                onclick="Auth.logout()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition w-full text-left"
              >
                <span>🚪</span> Logout
              </button>
            </nav>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 p-6">
          <!-- Header -->
          <div class="flex items-center justify-between mb-8">
            <div>
              <h1 class="text-3xl font-bold text-gray-900">My Products</h1>
              <p class="text-gray-500 mt-1" id="products-count"></p>
            </div>
            <a
              href="add-product.html"
              class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition"
            >
              + Add Product
            </a>
          </div>

          <!-- Search & Filter -->
          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 flex gap-4"
          >
            <input
              type="text"
              id="search-input"
              placeholder="Search products..."
              class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <select
              id="status-filter"
              onchange="filterProducts()"
              class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="all">All Status</option>
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
          </div>

          <!-- Products Table -->
          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th
                      class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                    >
                      Product
                    </th>
                    <th
                      class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                    >
                      Price
                    </th>
                    <th
                      class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                    >
                      Stock
                    </th>
                    <th
                      class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                    >
                      Status
                    </th>
                    <th
                      class="text-left px-6 py-4 text-sm font-medium text-gray-500"
                    >
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody id="products-table"></tbody>
              </table>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16">
              <p class="text-4xl mb-3">📦</p>
              <p class="font-medium text-gray-700 mb-2">No products yet</p>
              <a
                href="add-product.html"
                class="text-indigo-600 hover:underline text-sm"
              >
                Add your first product →
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/router.js"></script>
    <script src="../js/core/utils.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/components/loader.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/pages/vendor/products.js"></script>
  </body>
</html>
