<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Profile — Vendora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-gray-50">

  <div id="navbar"></div>

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100
                  fixed top-16 left-0 bottom-0 overflow-y-auto
                  hidden lg:block">
      <div class="p-6">
        <p class="text-xs font-semibold text-gray-400 uppercase
                  tracking-wider mb-4">Vendor Menu</p>
        <nav class="space-y-1">
          <a href="dashboard.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>📊</span> Dashboard
          </a>
          <a href="products.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>📦</span> Products
          </a>
          <a href="orders.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>🛍️</span> Orders
          </a>
          <a href="store-profile.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    bg-indigo-50 text-indigo-600 font-medium">
            <span>🏪</span> Store Profile
          </a>
          <a href="add-product.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>➕</span> Add Product
          </a>
          <hr class="my-3 border-gray-100">
          <a href="../index.html"
             class="flex items-center gap-3 px-4 py-3 rounded-xl
                    text-gray-600 hover:bg-gray-50 transition">
            <span>🏠</span> Back to Store
          </a>
          <button onclick="Auth.logout()"
                  class="flex items-center gap-3 px-4 py-3 rounded-xl
                         text-red-500 hover:bg-red-50 transition
                         w-full text-left">
            <span>🚪</span> Logout
          </button>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-64 p-6">

      <!-- Header -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Store Profile</h1>
        <p class="text-gray-500 mt-1">
          Manage your store information
        </p>
      </div>

      <!-- No Store Banner -->
      <div id="no-store-banner"
           class="hidden bg-blue-50 border border-blue-200
                  rounded-xl p-6 mb-6">
        <h3 class="font-bold text-blue-800 mb-1">
          Set Up Your Store
        </h3>
        <p class="text-sm text-blue-600 mb-4">
          You haven't set up your store yet.
          Fill in the details below to get started.
        </p>
      </div>

      <div class="max-w-2xl space-y-6">

        <!-- Store Info Form -->
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6">
          <h2 class="text-lg font-bold text-gray-900 mb-6">
            Store Information
          </h2>

          <form id="store-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium
                            text-gray-700 mb-1">
                Store Name *
              </label>
              <input type="text" id="store-name"
                     placeholder="e.g. Chidi Electronics"
                     class="w-full px-4 py-3 border border-gray-300
                            rounded-lg focus:outline-none focus:ring-2
                            focus:ring-indigo-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium
                            text-gray-700 mb-1">
                Store Description
              </label>
              <textarea id="store-description" rows="4"
                        placeholder="Tell customers about your store..."
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg focus:outline-none focus:ring-2
                               focus:ring-indigo-500 resize-none">
              </textarea>
            </div>

            <div>
              <label class="block text-sm font-medium
                            text-gray-700 mb-1">
                Store Logo URL
              </label>
              <input type="text" id="store-logo"
                     placeholder="https://..."
                     class="w-full px-4 py-3 border border-gray-300
                            rounded-lg focus:outline-none focus:ring-2
                            focus:ring-indigo-500"/>
            </div>

            <div>
              <label class="block text-sm font-medium
                            text-gray-700 mb-1">
                Store Banner URL
              </label>
              <input type="text" id="store-banner"
                     placeholder="https://..."
                     class="w-full px-4 py-3 border border-gray-300
                            rounded-lg focus:outline-none focus:ring-2
                            focus:ring-indigo-500"/>
            </div>

            <div class="flex gap-3 pt-2">
              <button type="submit" id="save-btn"
                      class="bg-indigo-600 text-white px-6 py-3
                             rounded-lg font-medium hover:bg-indigo-700
                             transition disabled:opacity-50">
                Save Changes
              </button>
              <a id="view-store-btn" href="#"
                 class="border border-gray-300 px-6 py-3 rounded-lg
                        text-gray-600 hover:bg-gray-50 transition
                        hidden">
                View Public Store →
              </a>
            </div>
          </form>
        </div>

        <!-- Store Status -->
        <div class="bg-white rounded-xl shadow-sm border
                    border-gray-100 p-6" id="store-status-card">
          <h2 class="text-lg font-bold text-gray-900 mb-4">
            Store Status
          </h2>
          <div id="store-status-content"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/core/auth.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/router.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/loader.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/pages/vendor/store-profile.js"></script>
</body>
</html>
